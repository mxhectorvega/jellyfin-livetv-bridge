name: tests

on:
  push:
  pull_request:

# Minimo privilegio: el workflow solo LEE el repositorio. Sin esto, los tokens de
# los steps tienen permiso de escritura por omision y una dependencia
# comprometida puede empujar codigo.
permissions:
  contents: read

# Una corrida por rama: al empujar dos veces seguidas se cancela la vieja.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # La imagen de produccion es python:3.12-slim. Probar tambien 3.13 evita el
    # punto ciego de correr la suite en un interprete distinto al que sirve.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q
      - name: pytest con cobertura
        run: python -m pytest --cov=src --cov-report=term-missing -q
      - name: mypy
        run: mypy src tests

  estilo:
    # El estilo se COMPRUEBA, no se pide por favor. Misma linea de 100 columnas
    # que declara pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff==0.17.0
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  e2e:
    # El banco sintetico genera un HLS real: necesita ffmpeg (y openssl, que ya
    # viene en el runner). Es el unico que prueba el arranque, no solo la logica.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Banco E2E
        run: python tests/e2e_sintetico.py
